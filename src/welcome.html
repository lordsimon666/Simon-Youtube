<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>Willkommen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="welcome">
    <img src="../build/icon.png" alt="">
    <h1>Willkommen bei Simon YouTube</h1>
    <p>Melde dich mit deinem Google-Konto an, um deine Abos, Empfehlungen und Kommentare zu nutzen – oder schau einfach ohne Anmeldung.</p>
    <div class="actions">
      <button id="login" class="btn primary">Mit Google anmelden</button>
      <button id="guest" class="btn">Ohne Anmeldung fortfahren</button>
    </div>
    <small>Du kannst dich später jederzeit oben rechts an- oder abmelden.</small>
  </div>
  <script src="welcome.js"></script>
</body>
</html>

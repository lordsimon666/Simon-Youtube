<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>Simon YouTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-i18n-doc="win.welcome">
  <div class="welcome">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="de">Deutsch</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
    <img src="../build/icon.png" alt="">
    <h1 data-i18n="welcome.title"></h1>
    <p data-i18n="welcome.text"></p>
    <div class="actions">
      <button id="login" class="btn primary" data-i18n="welcome.login"></button>
      <button id="guest" class="btn" data-i18n="welcome.guest"></button>
      <button id="cookies" class="btn ghost small" data-i18n="welcome.cookies" data-i18n-title="welcome.cookies.title"></button>
    </div>
    <small data-i18n="welcome.later"></small>
  </div>
  <script src="i18n.js"></script>
  <script src="welcome.js"></script>
</body>
</html>

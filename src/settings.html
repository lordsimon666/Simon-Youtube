<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>Simon YouTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-i18n-doc="win.settings">
  <div class="settings">
    <h1 data-i18n="set.title"></h1>

    <fieldset>
      <legend data-i18n="set.lang"></legend>
      <p class="desc" data-i18n="set.lang.desc"></p>
      <select id="lang">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.vol"></legend>
      <p class="desc" data-i18n="set.vol.desc"></p>
      <label class="opt"><input type="radio" name="volumeMode" value="auto"> <span data-i18n="set.vol.auto"></span></label>
      <label class="opt"><input type="radio" name="volumeMode" value="off"> <span data-i18n="set.vol.off"></span></label>
      <label class="opt"><input type="radio" name="volumeMode" value="custom"> <span data-i18n="set.vol.custom"></span></label>
      <div class="range" id="strength-row">
        <input type="range" id="volumeStrength" min="0" max="100" step="5">
        <output id="strength-out">50 %</output>
      </div>
      <p class="desc" style="margin:8px 0 0 26px" data-i18n="set.vol.strength"></p>
      <label class="opt"><input type="radio" name="volumeMode" value="agc"> <span data-i18n-html="set.vol.agc"></span></label>
    </fieldset>

    <fieldset id="agc-box">
      <legend data-i18n="set.agc"></legend>
      <p class="desc" data-i18n="set.agc.desc"></p>

      <div class="agc-top">
        <label><span data-i18n="set.agc.preset"></span>
          <select id="agc-preset">
            <option value="" data-i18n="set.agc.preset.custom"></option>
            <option value="standard" data-i18n="set.agc.preset.standard"></option>
            <option value="speech" data-i18n="set.agc.preset.speech"></option>
            <option value="music" data-i18n="set.agc.preset.music"></option>
            <option value="night" data-i18n="set.agc.preset.night"></option>
            <option value="broadcast" data-i18n="set.agc.preset.broadcast"></option>
          </select>
        </label>
        <button id="agc-reset" class="btn small ghost" data-i18n="set.agc.reset"></button>
      </div>

      <div class="meters" id="meters">
        <div class="meter"><span data-i18n="meter.in"></span><div class="bar"><i id="m-in"></i></div><output id="v-in">–</output></div>
        <div class="meter"><span data-i18n="meter.gain"></span><div class="bar center"><i id="m-gain"></i></div><output id="v-gain">–</output></div>
        <div class="meter"><span data-i18n="meter.out"></span><div class="bar"><i id="m-out"></i><b id="m-target"></b></div><output id="v-out">–</output></div>
        <div class="meter"><span data-i18n="meter.lim"></span><div class="bar"><i id="m-lim" class="lim"></i></div><output id="v-lim">–</output></div>
        <div class="meter-state" id="m-state"></div>
      </div>

      <div id="agc-controls" class="agc-grid"></div>
      <label class="opt"><input type="checkbox" id="agc-limiter"> <span data-i18n="set.agc.limiter"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.quality"></legend>
      <p class="desc" data-i18n="set.quality.desc"></p>
      <select id="quality">
        <option value="auto">Auto</option>
        <option value="hd2160">2160p (4K)</option>
        <option value="hd1440">1440p</option>
        <option value="hd1080">1080p</option>
        <option value="hd720">720p</option>
        <option value="large">480p</option>
        <option value="medium">360p</option>
        <option value="small">240p</option>
        <option value="tiny">144p</option>
      </select>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.cookies"></legend>
      <p class="desc" data-i18n-html="set.cookies.desc"></p>
      <button id="import-cookies" class="btn" data-i18n="set.cookies.btn"></button>
    </fieldset>

    <div class="foot" data-i18n="set.foot"></div>
  </div>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>Simon YouTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel-window">
  <div class="panel-head" data-role="video" hidden>
    <span class="panel-title">Video</span>
    <span id="now-title" class="now-title"></span>
    <button id="btn-later-current" class="btn small" title="Aktuelles Video zu „Später ansehen“ hinzufügen" hidden>+ Später</button>
  </div>
  <div class="panel-head" data-role="browser" hidden>
    <span class="panel-title">Browser</span>
    <div class="nav">
      <button data-nav="back" title="Zurück">&#8592;</button>
      <button data-nav="forward" title="Vor">&#8594;</button>
      <button data-nav="reload" title="Neu laden">&#8635;</button>
      <button data-nav="home" title="Startseite">&#8962;</button>
    </div>
    <span class="hint">Klick = abspielen · Mittelklick = später ansehen</span>
  </div>
  <div class="panel-head" data-role="comments" hidden>
    <div class="tabs">
      <button class="tab active" data-tab="comments">Kommentare</button>
      <button class="tab" data-tab="related">Vorschläge</button>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>

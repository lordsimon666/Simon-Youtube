<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://i.ytimg.com data:; style-src 'self'; script-src 'self'">
  <title>Simon YouTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../build/icon.png" alt="" class="brand-icon"><span class="brand-text">Simon YouTube</span></div>
    <div class="spacer"></div>
    <button id="btn-split" class="btn" title="Die vier Panels als eigene Fenster öffnen">
      <span class="ico">&#8862;</span> <span class="lbl">In 4 Fenster aufteilen</span>
    </button>
    <button id="btn-settings" class="btn icon" title="Einstellungen (Lautstärke-Ausgleich, Qualität)">&#9881;</button>
    <span id="auth-status" class="auth-status">Nicht angemeldet</span>
    <button id="btn-login" class="btn primary">Anmelden</button>
    <button id="btn-logout" class="btn" hidden>Abmelden</button>
  </header>

  <main id="layout">
    <div class="col" id="col-left">
      <section class="panel" id="panel-video">
        <div class="panel-head">
          <span class="panel-title">Video</span>
          <span id="now-title" class="now-title"></span>
          <button id="btn-later-current" class="btn small" title="Aktuelles Video zu „Später ansehen“ hinzufügen" hidden>+ Später</button>
        </div>
        <div class="slot" data-view="video"></div>
      </section>
      <div class="gutter gutter-row" data-split="left" title="Ziehen zum Anpassen"></div>
      <section class="panel" id="panel-browser">
        <div class="panel-head">
          <span class="panel-title">Browser</span>
          <div class="nav">
            <button data-nav="back" title="Zurück">&#8592;</button>
            <button data-nav="forward" title="Vor">&#8594;</button>
            <button data-nav="reload" title="Neu laden">&#8635;</button>
            <button data-nav="home" title="Startseite">&#8962;</button>
          </div>
          <span class="hint">Klick = abspielen · Mittelklick = später ansehen</span>
        </div>
        <div class="slot" data-view="browser"></div>
      </section>
    </div>

    <div class="gutter gutter-col" data-split="col" title="Ziehen zum Anpassen"></div>

    <div class="col" id="col-right">
      <section class="panel" id="panel-comments">
        <div class="panel-head">
          <div class="tabs">
            <button class="tab active" data-tab="comments">Kommentare</button>
            <button class="tab" data-tab="related">Vorschläge</button>
          </div>
        </div>
        <div class="slot" data-view="comments"></div>
      </section>
      <div class="gutter gutter-row" data-split="right" title="Ziehen zum Anpassen"></div>
      <section class="panel" id="panel-later">
        <div class="panel-head">
          <span class="panel-title">Später ansehen</span>
          <span id="later-count" class="badge">0</span>
          <div class="spacer"></div>
          <button id="btn-clear-later" class="btn small ghost" hidden>Alle entfernen</button>
        </div>
        <div class="later-list" id="later-list"></div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="renderer.js"></script>
</body>
</html>

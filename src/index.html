<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://i.ytimg.com data:; style-src 'self'; script-src 'self'">
  <title>Simon YouTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../build/icon.png" alt="" class="brand-icon"><span class="brand-text">Simon YouTube</span></div>
    <form id="address" class="address" autocomplete="off">
      <input id="address-input" type="text" spellcheck="false" data-i18n-placeholder="addr.placeholder">
      <button type="submit" class="addr-btn" id="addr-play" data-i18n-title="addr.play">&#9654;</button>
      <button type="button" class="addr-btn" id="addr-later" data-i18n-title="addr.later">+</button>
    </form>
    <div class="toggles" role="group">
      <button class="tgl" data-panel="browser" data-i18n-title="tgl.title"><span class="dot"></span><span data-i18n="tgl.browser"></span></button>
      <button class="tgl" data-panel="comments" data-i18n-title="tgl.title"><span class="dot"></span><span data-i18n="tgl.comments"></span></button>
      <button class="tgl" data-panel="later" data-i18n-title="tgl.title"><span class="dot"></span><span data-i18n="tgl.later"></span></button>
    </div>
    <button id="btn-split" class="btn">
      <span class="ico">&#8862;</span> <span class="lbl"></span>
    </button>
    <button id="btn-settings" class="btn icon" data-i18n-title="top.settings.title">&#9881;</button>
    <span id="auth-status" class="auth-status"></span>
    <button id="btn-login" class="btn primary" data-i18n="auth.login"></button>
    <button id="btn-logout" class="btn" data-i18n="auth.logout" hidden></button>
  </header>

  <main id="layout">
    <div class="col" id="col-left">
      <div class="pos" data-pos="tl">
      <section class="panel" id="panel-video">
        <div class="panel-head">
          <span class="grip" draggable="true" data-i18n-title="drag.grip">&#10303;</span>
          <span class="panel-title" data-i18n="panel.video"></span>
          <span id="now-title" class="now-title"></span>
          <button id="btn-copy-link" class="btn small ghost" data-i18n="video.copyLink" data-i18n-title="video.copyLink.title" hidden></button>
          <button id="btn-later-current" class="btn small" data-i18n="later.addCurrent" data-i18n-title="later.addCurrent.title" hidden></button>
        </div>
        <div class="slot" data-view="video"></div>
      </section>
      </div>
      <div class="gutter gutter-row" data-split="left" data-i18n-title="gutter.title"></div>
      <div class="pos" data-pos="bl">
      <section class="panel" id="panel-browser">
        <div class="panel-head">
          <span class="grip" draggable="true" data-i18n-title="drag.grip">&#10303;</span>
          <span class="panel-title" data-i18n="panel.browser"></span>
          <div class="nav">
            <button data-nav="back" data-i18n-title="nav.back">&#8592;</button>
            <button data-nav="forward" data-i18n-title="nav.forward">&#8594;</button>
            <button data-nav="reload" data-i18n-title="nav.reload">&#8635;</button>
            <button data-nav="home" data-i18n-title="nav.home">&#8962;</button>
          </div>
          <span class="hint" data-i18n="browser.hint"></span>
        </div>
        <div class="slot" data-view="browser"></div>
      </section>
      </div>
    </div>

    <div class="gutter gutter-col" data-split="col" data-i18n-title="gutter.title"></div>

    <div class="col" id="col-right">
      <div class="pos" data-pos="tr">
      <section class="panel" id="panel-comments">
        <div class="panel-head">
          <span class="grip" draggable="true" data-i18n-title="drag.grip">&#10303;</span>
          <div class="tabs">
            <button class="tab active" data-tab="comments" data-i18n="tab.comments"></button>
            <button class="tab" data-tab="related" data-i18n="tab.related"></button>
          </div>
        </div>
        <div class="slot" data-view="comments"></div>
      </section>
      </div>
      <div class="gutter gutter-row" data-split="right" data-i18n-title="gutter.title"></div>
      <div class="pos" data-pos="br">
      <section class="panel" id="panel-later">
        <div class="panel-head">
          <span class="grip" draggable="true" data-i18n-title="drag.grip">&#10303;</span>
          <span class="panel-title" data-i18n="panel.later"></span>
          <span id="later-count" class="badge">0</span>
          <div class="spacer"></div>
          <button id="btn-clear-later" class="btn small ghost" data-i18n="later.clear" hidden></button>
        </div>
        <div class="later-list" id="later-list"></div>
      </section>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="i18n.js"></script>
  <script src="later.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
